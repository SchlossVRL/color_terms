<!DOCTYPE html>
<html>

<head>
    <title>Color-Concept Association Experiment</title>

    <!-- jsPsych -->
    <script src="jsPsych/jspsych.js"></script>
    <script src="jsPsych/plugin-html-button-response.js"></script>
    <script src="jsPsych/plugin-html-keyboard-response.js"></script>
    <script src="jsPsych/plugin-survey-text.js"></script>
    <script src="jsPsych/plugin-survey-multi-select.js"></script>
    <script src="jsPsych/plugin-association-slider_AC.js"></script>
    <script src="jsPsych/plugin-fullscreen.js"></script>

    <!-- Experiment conditions -->
    <script src="exp0_conditions.js"></script>

    <!-- jsPsychPipe -->
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

    <link href="jsPsych/jspsych.css" rel="stylesheet" type="text/css">

    <style>
        #demo-association-slider::-webkit-slider-runnable-track {
            height: 1px;
            background: black;
        }

        #demo-association-slider::-moz-range-track {
            height: 1px;
            background: black;
        }

        #demo-association-slider::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 1px;
            height: 30px;
            background: black;
            border: none;
            margin-top: -13px;
        }

        #demo-association-slider::-moz-range-thumb {
            width: 1px;
            height: 30px;
            background: black;
            border: none;
            border-radius: 0;
        }
    </style>

</head>

<body></body>

<script>

    async function startExperiment() {

        // --------------------------------------------------
        // INITIALIZE JPSYCH
        // --------------------------------------------------

        var filename;
        var jsPsych = initJsPsych({
            on_finish: function () {
                jsPsych.data.get().localSave('csv', filename);
            }
        });

        const sona_id = jsPsych.data.getURLVariable('id');

        var participant_id = jsPsych.randomization.randomID(10);
        filename = `${participant_id}.csv`;

        // --------------------------------------------------
        // EXPERIMENT SETTINGS
        // --------------------------------------------------

        // IMPORTANT: Replace this with your new jsPsychPipe experiment ID.
        // Testing = 5GxC2cpP6Azv
        // SONA data - .....
        const experiment_id = "5GxC2cpP6Azv";

        const condition_num = await jsPsychPipe.getCondition(experiment_id);

        //const condition_num = 0;

        // Make sure the returned condition is valid.
        const assigned_condition = Number(condition_num);

        if (!concept_conds[assigned_condition]) {
            alert("Error: Invalid experimental condition.");
            return;
        }

        // Get the five concepts assigned to this participant.
        const assigned_concepts = concept_conds[assigned_condition];

        console.log("Condition:", assigned_condition);
        console.log("Assigned concepts:", assigned_concepts);

        // Add participant information to every trial.
        jsPsych.data.addProperties({
            participant_id: participant_id,
            sona_id: sona_id,
            condition_num: assigned_condition
        });

        // --------------------------------------------------
        // TIMELINE
        // --------------------------------------------------

        let timeline = [];

        // Set background color.
        document.body.style.backgroundColor = "rgb(128,128,128)";

        // --------------------------------------------------
        // SHUFFLE FUNCTION
        // --------------------------------------------------

        function shuffleArray(array) {
            let arr = array.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --------------------------------------------------
        // LOAD COLOR DATA
        // --------------------------------------------------

        let colors = [];

        try {

            const response = await fetch('UW71coordinates_long.csv');

            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const csvText = await response.text();

            const lines = csvText.trim().split(/\r?\n/);

            const headers = lines[0].replace(/^\uFEFF/, '').split(',');

            const vIndexColumn = headers.indexOf('v_index');
            const colorIndexColumn = headers.indexOf('color_index');
            const colorHexColumn = headers.indexOf('color_hex');

            if (vIndexColumn === -1 || colorIndexColumn === -1 || colorHexColumn === -1) {
                throw new Error("Required columns (v_index, color_index, color_hex) were not found.");
            }

            for (let i = 1; i < lines.length; i++) {

                if (lines[i].trim() === "") {
                    continue;
                }

                const cols = lines[i].split(',');

                const v_index = cols[vIndexColumn].trim();
                const color_index = Number(cols[colorIndexColumn].trim());
                const color_hex = cols[colorHexColumn].trim();

                if (v_index && !Number.isNaN(color_index) && color_hex.startsWith('#')) {

                    colors.push({
                        v_index: v_index,
                        color_index: color_index,
                        color_hex: color_hex
                    });
                }
            }

            console.log("Loaded colors:", colors);
            console.log("Total colors:", colors.length);

            if (colors.length !== 71) {
                throw new Error(`Expected 71 colors, but found ${colors.length}.`);
            }

        } catch (error) {

            console.error("Error loading color data:", error);

            alert(
                "Failed to load color data.\n\n" +
                error.message +
                "\n\nPlease check that UW71coordinates_long.csv is in the correct location."
            );

            return;
        }

        // --------------------------------------------------
        // WELCOME SCREEN
        // --------------------------------------------------

        // Initial welcome screen
        var initial_screen = {
            type: jsPsychHtmlButtonResponse,
            stimulus: 'Welcome to our experiment!' +
                '<p>At the bottom of this screen, you will see a button that says "Begin Experiment".' +
                '<br>Please only click that button when you are ready to complete the 30 minute experiment in one sitting.</p>' +
                '<p> Once you click that button, it will not be possible to restart the experiment.',
            choices: ['Begin Experiment']
        }
        timeline.push(initial_screen);

        // --------------------------------------------------
        // FULLSCREEN
        // --------------------------------------------------

        timeline.push({
            type: jsPsychFullscreen,
            fullscreen_mode: true
        });


        //--------------------------------------------------
        // CONSENT
        //--------------------------------------------------
        var consentSign = {
            type: jsPsychSurveyMultiSelect,
            questions: [
                {
                    prompt:
                        "  <strong>UNIVERSITY OF WISCONSIN-MADISON</strong>" +
                        "  <br><strong>Research Participant Information and Consent Form</strong>" +
                        " <br><br><strong>Title of the Study:</strong> Investigating how observers perceive, interpret, and evaluate visual features in 2D scenes and 3D environments" +
                        " <br><br><strong>Principal Investigator:</strong> Karen B. Schloss (phone: 608-316-4495) (email: kschloss@wisc.edu)" +
                        "  <br><br><strong><u>DESCRIPTION OF THE RESEARCH</u></strong>" +
                        "  <br>You are invited to participate in a research study about how visual features influence the ability to perceive, interpret, navigate, and remember information in visual displays" +
                        "  <br><br>You have been asked to participate because you saw a description of the study and signed up to be a participant." +
                        "  <br><br>The purpose of the research is to understand principles by which people perceive, evaluate and interpret visual information (e.g., the meaning of parts of a scientific diagram)." +
                        "  <br><br>This study will include adults from UW-Madison and nearby areas who volunteer to participate." +
                        "  <br><br>The research will be conducted online, with no requirement to appear in person." +
                        "  <br><br><strong><u>WHAT WILL MY PARTICIPATION INVOLVE?</u></strong>" +
                        "  <br>If you decide to participate in this research you will be presented with visual displays containing images and/or text and will be asked to make judgments about them. For example, you may see shapes and be asked how round they appear or view a graph with a legend and interpret information about the data in the graph." +
                        "  <br><br>You will be asked to respond by making button presses on a keyboard/mouse. You may be asked to complete questionnaires about your expertise or educational level in a given domain (e.g., neuroscience) and questionnaires about what sorts of things you like/dislike. Finally, you may be asked to respond to questions about your experience during the experiment (e.g., how much you enjoyed the task)." +
                        "  <br><br>You will be asked to complete 2-6 surveys or tasks." +
                        "  <br><br>Your participation will last approximately 30-60 minutes per session (as specified when you signed up to participate) and will require 1 session (30 to 60 min total)." +
                        "  <br><br><strong><u>ARE THERE ANY RISKS TO ME?</u></strong>" +
                        "  <br>We don't anticipate any risks to you from participating in this study." +
                        "  <br><br><strong><u>ARE THERE ANY BENEFITS TO ME?</u></strong>" +
                        "  <br>There are no direct benefits for participating in this study." +
                        "  <br><br><strong><u>WILL I BE COMPENSATED FOR MY PARTICIPATION?</u></strong>" +
                        "  <br>Consistent with PSY 202/210/225 policies, you will receive 1 extra credit point/30 minutes of study participation. At the end of the semester, those extra credit points are converted such that 1 point of extra credit = 0.33% added directly to your grade at the end of term. Consult your class syllabus for additional details regarding the application of extra credit points to your final grade." +
                        "  <br><br><strong><u>HOW WILL MY CONFIDENTIALITY BE PROTECTED?</u></strong>" +
                        "  <br>While there will probably be publications as a result of this study, your name will not be used. Typically, group characteristics will be published, but datasets with individual responses may also be shared. In such cases, the data will not be linked to your name or other identifiable information." +
                        "  <br><br><strong><u>WHOM SHOULD I CONTACT IF I HAVE QUESTIONS?</u></strong>" +
                        "  <br>You may ask any questions about the research at any time. If you have questions about the research you can contact the Principal Investigator Karen B. Schloss at 608-316-4495." +
                        "  <br><br>If you are not satisfied with response of research team, have more questions, or want to talk with someone about your rights as a research participant, you should contact the Education and Social/Behavioral Science IRB Office at 608-263-2320." +
                        "  <br><br>Your participation is completely voluntary. If you decide not to participate or to withdraw from the study you may do so without penalty." +
                        "  <br><br>By clicking the box below, you confirm that you have read this consent form, had an opportunity to ask any questions about your participation in this research and voluntarily consent to participate. You may print a copy of this form for your records." +
                        "  <br><br>Please click the box below next to the text 'I consent' to give your informed consent to participate. " +
                        "   </p>",
                    options: ["<strong>I consent</strong>"],
                    horizontal: false,
                    required: true,
                    name: 'Consent'
                },
            ],
            button_label: "Start Experiment",
        };

        timeline.push(consentSign);

        //--------------------------------------------------
        // OVERVIEW
        //--------------------------------------------------
        // Overview instructions of experiment
        var overview_instructions = {
            type: jsPsychHtmlButtonResponse,
            stimulus: 'Welcome! <p> This experiment involves two parts: demographic information, followed by the experimental task.' +
                '<p> It will take about 30 minutes to complete both parts.',
            choices: ['Continue']
        }
        timeline.push(overview_instructions);

        //--------------------------------------------------
        // DEMOGRAPHIC INFORMATION
        //--------------------------------------------------
        var age_lang_demo = {
            type: jsPsychSurveyText,
            questions: [
                { prompt: "Age", name: 'Age', rows: "1", columns: "3", required: true, },
                { prompt: "Gender", name: 'Gender', rows: "1", columns: "15", required: true, },
                { prompt: "Race/ethnicity", name: 'Race/ethnicity', rows: "1", columns: "30", required: true, },
                { prompt: "List all languages you know", name: "Languages", rows: "6", columns: "60", required: true, }
            ],
            preamble: "Please answer the following questions.",
            button_label: "Done",
            randomize_question_order: false
        }
        timeline.push(age_lang_demo);

        // --------------------------------------------------
        // INSTRUCTIONS
        // --------------------------------------------------

        // Sort colors by their original index
        const orderedColors = [...colors].sort((a, b) =>
            a.color_index - b.color_index
        );

        const instructions = {
            type: jsPsychHtmlButtonResponse,
            stimulus: `
        <div style="width:100%; padding-bottom:30px;">

            <div style="
                text-align:left;
                font-size:18px;
                line-height:25px;
                width:1200px;
            ">
                During this experiment you will be presented with a series of concepts, one at a time, from the set below:
            </div>

            <div style="
                text-align:left;
                width:1200px;
            ">

                <p style="
                    font-size:18px;
                    line-height:20px;
                    text-align:center;
                    font-weight:bold;
                ">
                    ${assigned_concepts.join(", ")}
                </p>
            </div>

            <div style="
                text-align:left;
                font-size:18px;
                line-height:25px;
                width:1200px;
            ">
                For each concept, you will be asked to rate how much you associate it with each of the colors below on a scale from 'not at all' to 'very much'. <br>
            </div>

            <div style="
                display:flex;
                justify-content:center;
                width:90%;
            ">
                <div style="
                    width:750px;
                    display:grid;
                    grid-template-columns:repeat(18, 1fr);
                    gap:3px;
                    padding:3px;
                    margin:0 auto;
                ">

                    ${orderedColors.map(color => `
                        <div style="
                            width:100%;
                            aspect-ratio:1;
                            background-color:${color.color_hex};
                        "></div>
                    `).join('')}
                </div>
            </div>
            <br>
            <div style="
                text-align:left;
                font-size:18px;
                line-height:25px;
                width:1200px;
            ">
                Each trial will include one concept word and one color.
                You will be asked to make your rating by sliding the cursor along a slider response scale and clicking to record you response and continue to the next trial.

    <div style="text-align:center; margin:20px auto;">
    <input
        type="range"
        id="demo-association-slider"
        min="-200"
        max="200"
        step="1"
        value="0"
        style="
            width:500px;
            max-width:85vw;
            height:30px;
            margin:0 auto;
            display:block;
            appearance:none;
            -webkit-appearance:none;
            background:transparent;
            cursor:pointer;
            "
        >

    <div style="
        width:500px;
        max-width:85vw;
        margin:-17px auto 0 auto;
        height:4px;
        position:relative;
        pointer-events:none;
        ">

        <span style="
            position:absolute;
            left:0;
            top:-12px;
            height:30px;
            width:1px;
            background:black;
        "></span>

        <span style="
            position:absolute;
            left:50%;
            top:-6px;
            height:16px;
            width:1px;
            background:black;
        "></span>
        
        <span style="
            position:absolute;
            right:0;
            top:-12px;
            height:30px;
            width:1px;
            background:black;
            "></span>
        </div>

        <div style="
            width:500px;
            max-width:85vw;
            margin:0 auto;
            position:relative;
            font-size:16px;
                height:25px;
            ">
            <span style="
                position:absolute;
                left:0;
                top:15px;
                transform:translateX(-50%);
                white-space:nowrap;
            ">
                Not at all
            </span>
                <span style="
                    position:absolute;
                    right:0;
                    top:15px;
                    transform:translateX(50%);
                    white-space:nowrap;
                ">
                    Very much
                </span>
            </div>
        </div>
                Before beginning, please look at the list of concepts and colors.
                For each concept, think about the color you associate least with it.
                When you see that color paired with that concept, please click on the left endpoint of the scale near 'not at all'.
                <br><br>
                Now, please think about the color you associate most with it.
                When you see that color paired with that concept, please click on the right endpoint of the scale near 'very much'.
                <br><br>
                Please use the full range of the scale. That is, if you believe a concept is somewhat associated with a color, you would click at the midpoint of the scale.
                You will be asked to rate each color for a given concept before moving on to the next. We are interested in your initial impressions of each concept and color pair, so please go with your first intuition.
                <br><br>
                The experiment will take about 30 minutes, and there will be 5 blocks of trials. You will be notified when you have completed each block and will have the opportunity to take a short break before continuing to the next block.
                <br><br>
                Please press 'Continue' to begin the experiment.
            </div>
        </div>
    `,
            choices: ["Continue"],
            on_load: function () {
                const slider = document.getElementById("demo-association-slider");
                demoMouseHandler = function (event) {
                    const rect = slider.getBoundingClientRect();
                    let x = event.clientX - rect.left;
                    x = Math.max(0, Math.min(x, rect.width));
                    const percent = x / rect.width;
                    slider.value = Math.round(-200 + percent * 400);
                };
                document.addEventListener("mousemove", demoMouseHandler);
            },
            on_finish: function () {
                document.removeEventListener("mousemove", demoMouseHandler);
            }
        };
        timeline.push(instructions);

        // --------------------------------------------------
        // BLOCK INTRODUCTION SCREEN
        // --------------------------------------------------
        function blockIntro(concept, blockNum) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
            <div class="break-screen">
                <p>Block ${blockNum} of 5</p>
                <p>For the following trials, you will be asked to rate how much you associate each color with the concept:</p>
                <h2>${concept}</h2>
                <p>Please click 'Continue' when you are ready to begin.</p>
            </div>
        `,
                choices: ['Continue']
            };
        }

        // --------------------------------------------------
        // BREAK SCREEN
        // --------------------------------------------------
        function breakScreen(blockNum) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
            <div class="break-screen">
                <p>You have completed block <bold>${blockNum} of 5. </bold></p>
                <p>Please take a short break if you need one.</p>
                <p>Please click 'Continue' when you are ready to proceed.</p>
            </div>
        `,
                choices: ['Continue']
            };
        }

        // --------------------------------------------------
        // CUSTOM SLIDER TRIAL
        // --------------------------------------------------

        const association_trial = {
            type: jsPsychAssociationSlider,
            concept: jsPsych.timelineVariable('concept'),
            color_hex: jsPsych.timelineVariable('color_hex'),
            data: {
                concept: jsPsych.timelineVariable('concept'),
                block: jsPsych.timelineVariable('block'),
                block_order: jsPsych.timelineVariable('block_order'),
                v_index: jsPsych.timelineVariable('v_index'),
                color_index: jsPsych.timelineVariable('color_index'),
                color_hex: jsPsych.timelineVariable('color_hex')
            }
        };

        // 500 ms ITI is built into custom plugin, so no need to add a separate ITI trial. (Can adjust at bottom of pluggin script in the finish handler)

        // --------------------------------------------------
        // BREAK SCREEN
        // --------------------------------------------------

        function breakScreen(blockNum) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div class="break-screen">
                        <p>You have completed block ${blockNum} of 5.</p>
                        <p>Please take a short break if you need one.</p>
                        <p>Please click 'Continue' when you are ready for the next block.</p>
                    </div>
                `,
                choices: ['Continue']
            };
        }

        // --------------------------------------------------
        // CREATE RANDOMIZED CONCEPT BLOCKS
        // --------------------------------------------------

        // Randomize the order of the five concepts.
        const shuffled_concepts = shuffleArray(assigned_concepts);

        console.log("Randomized concept order:", shuffled_concepts);


        // Create one block per concept.
        for (let b = 0; b < shuffled_concepts.length; b++) {

            const concept = shuffled_concepts[b];

            // Add introduction screen for this concept.
            timeline.push(blockIntro(concept, b + 1));

            // Independently randomize all 71 colors within this block.
            const shuffled_colors = shuffleArray(colors);

            // Add concept and block information to each color trial.
            const block_trials = shuffled_colors.map((color) => {

                return {
                    concept: concept,
                    block: b + 1,
                    block_order: b + 1,
                    v_index: color.v_index,
                    color_index: color.color_index,
                    color_hex: color.color_hex
                };
            });

            // Add the trials for this concept block.
            timeline.push({
                timeline: [association_trial],
                timeline_variables: block_trials,
                randomize_order: false
            });

            // Add a break after blocks 1–4, but not after the final block.

            if (b < shuffled_concepts.length - 1) {
                timeline.push(breakScreen(b + 1));
            }
        }

        // --------------------------------------------------
        // SAVE DATA TO ZENODO
        // --------------------------------------------------

        const save_data = {
            type: jsPsychPipe,
            action: "save",
            experiment_id: experiment_id,
            filename: filename,
            wait_message: "Please wait while your data are being saved.",
            data_string: () => jsPsych.data.get().csv()
        };

        timeline.push(save_data);


        // --------------------------------------------------
        // EXIT FULLSCREEN
        // --------------------------------------------------

        timeline.push({
            type: jsPsychFullscreen,
            fullscreen_mode: false
        });

        // --------------------------------------------------
        // DEBRIEF
        // --------------------------------------------------

        const debrief_screen = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div style="width:800px; margin:auto;">
                    <h2>Thank you for participating!</h2>
                    <p>You have completed the experiment.</p>
                    <p>The goal of this study is to investigate the associations between colors and the terms which can be used to describe them</p>
                    <p>Others who participated in this study may have been shown different concepts that the ones you were shown.</p>
                    <p>Please do not inform other potential participants about the goals of our experiment.</p>
                    <p>Credit for your participation will appear on SONA in the next few days.</p>
                    <p>Thank you for your time!</p>
                    <p>You may now close this window.</p>
                </div>
            `,
            choices: ['NO_KEYS']
        };

        timeline.push(debrief_screen);

        // --------------------------------------------------
        // RUN EXPERIMENT
        // --------------------------------------------------

        console.log("Timeline:", timeline);

        jsPsych.run(timeline).then(() => {
            if (sona_id) {
                window.location.href =
                    `https://uwmadison.sona-systems.com/webstudy_credit.aspx?experiment_id=1652&credit_token=ea076512702d447d87e368a354e37fd9&survey_code=${sona_id}`;

            }

        });

    }

    startExperiment();

</script>

</html>
